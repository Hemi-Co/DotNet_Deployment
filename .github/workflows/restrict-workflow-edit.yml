name: Restrict Workflow File Changes

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

jobs:
  restrict-workflow-edits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 🔥 REQUIRED

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            git diff --name-only origin/${{ github.base_ref }}...HEAD > files.txt
          else
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} > files.txt
          fi

          echo "Changed files:"
          cat files.txt

      - name: Restrict workflow file edits
        run: |
          # ✅ Allowed users
          ALLOWED_USERS=("hemi42662711")

          IS_ALLOWED=false
          for USER in "${ALLOWED_USERS[@]}"; do
            if [ "$USER" = "${{ github.actor }}" ]; then
              IS_ALLOWED=true
            fi
          done

          if grep -E "^\.github/workflows/.*\.(yml|yaml)$" files.txt; then
            if [ "$IS_ALLOWED" = false ]; then
              echo "❌ ERROR: ${{ github.actor }} is NOT allowed to modify workflow files!"
              exit 1
            else
              echo "✅ Authorized user modifying workflow files"
            fi
          else
            echo "✅ No restricted files changed"
          fi
